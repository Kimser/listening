<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="English Listening Practice Tool - Improve your English listening skills">
  <meta name="theme-color" content="#0f0e17">
  <title>English Listening Pro</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="logo"><i class="ri-headphone-fill"></i> ListenPro</div>
      <div class="header-actions">
        <button id="btnStats" class="icon-btn" title="Statistics"><i class="ri-bar-chart-2-fill"></i></button>
        <button id="btnWordbook" class="icon-btn" title="Word Book"><i class="ri-book-mark-fill"></i></button>
      </div>
    </header>

    <!-- Filters -->
    <section class="filter-bar">
      <div class="filter-group">
        <label>Type</label>
        <div class="seg-control" id="typeFilter">
          <button class="seg-btn active" data-value="all">All</button>
          <button class="seg-btn" data-value="interrogative">Interrogative</button>
          <button class="seg-btn" data-value="declarative">Declarative</button>
        </div>
      </div>
      <div class="filter-group">
        <label>Level</label>
        <div class="seg-control" id="levelFilter">
          <button class="seg-btn active" data-value="all">All</button>
          <button class="seg-btn" data-value="elementary"><i class="ri-seedling-line"></i> A1-A2</button>
          <button class="seg-btn" data-value="intermediate"><i class="ri-fire-line"></i> B1-B2</button>
          <button class="seg-btn" data-value="advanced"><i class="ri-rocket-line"></i> C1-C2</button>
        </div>
      </div>
    </section>

    <!-- Sentence Display -->
    <section class="display-card" id="displayCard">
      <div class="card-badge" id="cardBadge">Elementary</div>
      <p class="sentence-text" id="sentenceText">Select a sentence to start practicing</p>
      <div class="card-meta">
        <span id="sentenceIndex">0 / 0</span>
        <button id="btnFontSize" class="icon-btn-sm" title="Font Size"><i class="ri-font-size-2"></i></button>
      </div>
    </section>

    <!-- Player Controls -->
    <section class="player-section">
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="player-controls">
        <button id="btnPrev" class="ctrl-btn"><i class="ri-skip-back-fill"></i></button>
        <button id="btnPlay" class="ctrl-btn ctrl-btn-main"><i class="ri-play-fill" id="playIcon"></i></button>
        <button id="btnNext" class="ctrl-btn"><i class="ri-skip-forward-fill"></i></button>
      </div>
      <div class="player-options">
        <div class="option-group">
          <label>Speed</label>
          <div class="speed-control" id="speedControl">
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn" data-speed="0.75">0.75x</button>
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="1.25">1.25x</button>
            <button class="speed-btn" data-speed="1.5">1.5x</button>
          </div>
        </div>
        <div class="option-group">
          <label>Mode</label>
          <div class="seg-control" id="playMode">
            <button class="seg-btn active" data-value="sequential"><i class="ri-order-play-fill"></i> Sequential</button>
            <button class="seg-btn" data-value="loop"><i class="ri-repeat-one-fill"></i> Loop</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Sentence List -->
    <section class="sentence-list-section">
      <div class="list-header">
        <h2>Sentences</h2>
        <span class="count-badge" id="listCount">0</span>
      </div>
      <ul class="sentence-list" id="sentenceList"></ul>
    </section>

    <!-- Word Popup -->
    <div class="word-popup" id="wordPopup">
      <div class="popup-header">
        <span class="popup-word" id="popupWord"></span>
        <button class="popup-fav" id="popupFav"><i class="ri-star-line"></i></button>
        <button class="popup-close" id="popupClose"><i class="ri-close-line"></i></button>
      </div>
      <div class="popup-phonetic" id="popupPhonetic"></div>
      <div class="popup-meaning" id="popupMeaning"></div>
      <div class="popup-examples" id="popupExamples"></div>
    </div>

    <!-- Stats Modal -->
    <div class="modal-overlay" id="statsModal">
      <div class="modal-content">
        <div class="modal-header"><h2>Learning Stats</h2><button class="popup-close" id="closeStats"><i class="ri-close-line"></i></button></div>
        <div class="stats-grid" id="statsGrid"></div>
      </div>
    </div>

    <!-- Wordbook Modal -->
    <div class="modal-overlay" id="wordbookModal">
      <div class="modal-content">
        <div class="modal-header"><h2>Word Book</h2><button class="popup-close" id="closeWordbook"><i class="ri-close-line"></i></button></div>
        <ul class="wordbook-list" id="wordbookList"></ul>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
