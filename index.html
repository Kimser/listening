<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="English Listening Practice Tool - Improve your English listening skills"
    />
    <meta name="theme-color" content="#0f0e17" />
    <title>Listening Pro</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg?v=2" />
    <link rel="apple-touch-icon" href="icon.svg?v=2" />
    <link rel="manifest" href="manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- Auth guard: runs before page renders to avoid flash of protected content -->
    <script src="js/auth.js"></script>
    <script>
      // Immediately redirect if no session in storage (fast, synchronous check)
      // Full re-verification against users.json happens asynchronously via auth-guard.js
      (function () {
        if (!Auth.getSession()) {
          Auth.redirectToLogin();
        }
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="app-header">
        <div class="logo"><i class="ri-headphone-fill"></i> ListenPro</div>
        <div class="header-actions">
          <button
            id="btnPersonalize"
            class="icon-btn"
            data-i18n-title="personalizeTitle"
            title="Personalize"
          >
            <i class="ri-settings-3-line"></i>
          </button>
          <button
            id="btnTheme"
            class="icon-btn"
            data-i18n-title="titleTheme"
            title="Toggle Theme"
          >
            <i class="ri-moon-line" id="themeIcon"></i>
          </button>
          <div class="dropdown" id="headerDropdown">
            <button
              id="btnMore"
              class="icon-btn"
              data-i18n-title="titleMore"
              title="More Options"
            >
              <i class="ri-more-2-fill"></i>
            </button>
            <div class="dropdown-menu">
              <button id="btnLang" class="dropdown-item">
                <i class="ri-translate-2"></i>
                <span data-i18n="language">Language</span>
              </button>
              <button id="btnStats" class="dropdown-item">
                <i class="ri-bar-chart-2-fill"></i>
                <span data-i18n="statsTitle">Statistics</span>
              </button>
              <button id="btnWordbook" class="dropdown-item">
                <i class="ri-book-mark-fill"></i>
                <span data-i18n="wordbookTitle">Word Book</span>
              </button>
              <div class="dropdown-divider"></div>
              <button id="btnLogout" class="dropdown-item text-danger">
                <i class="ri-logout-circle-r-line"></i>
                <span data-i18n="logout">Logout</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Filters -->
      <section class="filter-bar">
        <div class="filter-group">
          <label data-i18n="type">Type</label>
          <div class="seg-control" id="typeFilter">
            <button
              class="seg-btn active"
              data-value="category"
              data-i18n="category"
            >
              Category
            </button>
            <button class="seg-btn" data-value="dialogue" data-i18n="dialogue">
              Dialogue
            </button>
          </div>
        </div>
        <div class="filter-group">
          <label data-i18n="level">Level</label>
          <div class="seg-control" id="levelFilter">
            <!-- <button class="seg-btn" data-value="all" data-i18n="all">
              All
            </button> -->
            <button class="seg-btn active" data-value="elementary">
              <i class="ri-seedling-line"></i> A1-A2
            </button>
            <button class="seg-btn" data-value="intermediate">
              <i class="ri-fire-line"></i> B1-B2
            </button>
            <button class="seg-btn" data-value="advanced">
              <i class="ri-rocket-line"></i> C1-C2
            </button>
          </div>
        </div>
      </section>

      <!-- Sentence Display & Player Sticky Wrap -->
      <div class="sticky-player-wrap">
        <section class="display-card" id="displayCard">
          <div class="card-badge" id="cardBadge">Elementary</div>
          <p class="sentence-text" id="sentenceText" data-i18n="selectPrompt">
            Select a sentence to start practicing
          </p>
          <div class="card-meta">
            <span id="sentenceIndex">0 / 0</span>
            <div style="display: flex; gap: 8px; align-items: center">
              <!-- Mini Player Controls (visible only when collapsed) -->
              <div class="mini-player-controls" id="miniPlayerControls">
                <button id="btnMiniPrev" class="icon-btn-sm">
                  <i class="ri-skip-back-fill"></i>
                </button>
                <button id="btnMiniPlay" class="icon-btn-sm">
                  <i class="ri-play-fill" id="miniPlayIcon"></i>
                </button>
                <button id="btnMiniNext" class="icon-btn-sm">
                  <i class="ri-skip-forward-fill"></i>
                </button>
              </div>
              <button
                id="btnTogglePlayer"
                class="icon-btn-sm"
                data-i18n-title="titlePlayer"
                title="Toggle Player"
              >
                <i class="ri-arrow-down-s-line" id="playerToggleIcon"></i>
              </button>
              <button
                id="btnToggleCn"
                class="icon-btn-sm"
                data-i18n-title="titleTrans"
                title="Toggle EN/CN"
              >
                <i class="ri-translate"></i>
              </button>
              <button
                id="btnFontSize"
                class="icon-btn-sm"
                data-i18n-title="titleFont"
                title="Font Size"
              >
                <i class="ri-font-size-2"></i>
              </button>
            </div>
          </div>
        </section>

        <!-- Player Controls -->
        <section class="player-section" id="playerSection">
          <div class="progress-bar-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="player-controls">
            <button id="btnPrev" class="ctrl-btn">
              <i class="ri-skip-back-fill"></i>
            </button>
            <button id="btnPlay" class="ctrl-btn ctrl-btn-main">
              <i class="ri-play-fill" id="playIcon"></i>
            </button>
            <button id="btnNext" class="ctrl-btn">
              <i class="ri-skip-forward-fill"></i>
            </button>
          </div>
          <div class="player-options">
            <div class="option-group">
              <label data-i18n="speed">Speed</label>
              <div class="speed-control" id="speedControl">
                <button class="speed-btn" data-speed="0.5">0.5x</button>
                <button class="speed-btn active" data-speed="0.75">
                  0.75x
                </button>
                <button class="speed-btn" data-speed="1">1x</button>
                <button class="speed-btn" data-speed="1.25">1.25x</button>
                <button class="speed-btn" data-speed="1.5">1.5x</button>
              </div>
            </div>
            <div class="option-group">
              <label data-i18n="mode">Mode</label>
              <div class="seg-control" id="playMode">
                <button class="seg-btn active" data-value="sequential">
                  <i class="ri-order-play-fill"></i>
                  <span data-i18n="sequential">Sequential</span>
                </button>
                <button class="seg-btn" data-value="loop">
                  <i class="ri-repeat-one-fill"></i>
                  <span data-i18n="loop">Loop</span>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
      <!-- /sticky-player-wrap -->

      <!-- Sentence List -->
      <section class="sentence-list-section">
        <div class="list-header">
          <div style="display: flex; align-items: center; gap: 8px">
            <h2 data-i18n="sentences">Sentences</h2>
            <span class="count-badge" id="listCount">0</span>
          </div>
          <div style="display: flex; gap: 8px">
            <button
              id="btnBackToTop"
              class="icon-btn-sm"
              data-i18n-title="titleTop"
              title="Back to Top"
            >
              <i class="ri-arrow-up-line"></i>
            </button>
            <button
              id="btnLocate"
              class="icon-btn-sm"
              data-i18n-title="titleLocate"
              title="Locate Current Sentence"
            >
              <i class="ri-focus-3-line"></i>
            </button>
          </div>
        </div>
        <ul class="sentence-list" id="sentenceList"></ul>
      </section>

      <!-- Word Popup -->
      <div class="word-popup" id="wordPopup">
        <div class="popup-header">
          <span class="popup-word" id="popupWord"></span>
          <div class="popup-actions">
            <button class="popup-fav" id="popupFav" title="Save Word">
              <i class="ri-star-line"></i>
            </button>
            <button class="popup-close" id="popupClose" title="Close">
              <i class="ri-close-line"></i>
            </button>
          </div>
        </div>
        <div class="popup-pronunciations" id="popupPronunciations"></div>
        <div class="popup-meaning" id="popupMeaning"></div>
        <div class="popup-examples" id="popupExamples"></div>
      </div>

      <!-- Personalization Drawer -->
      <div class="drawer-overlay" id="settingsOverlay"></div>
      <aside class="settings-drawer" id="settingsDrawer">
        <div class="drawer-header">
          <h3 data-i18n="personalizeTitle">Personalization</h3>
          <button class="popup-close" id="closeSettingsDrawer">
            <i class="ri-close-line"></i>
          </button>
        </div>
        <div class="drawer-section">
          <label class="drawer-label" data-i18n="accentLabel"
            >English Accent</label
          >
          <div class="seg-control" id="accentControl">
            <button
              class="seg-btn accent-btn"
              data-accent="us"
              data-i18n="accentUs"
            >
              US
            </button>
            <button
              class="seg-btn accent-btn"
              data-accent="uk"
              data-i18n="accentUk"
            >
              UK
            </button>
          </div>
        </div>
        <div class="drawer-section">
          <label class="drawer-label" data-i18n="voiceLabel">Voice</label>
          <div class="voice-select-wrap">
            <div class="custom-select" id="voiceSelect">
              <div class="select-trigger">
                <span class="select-value" data-i18n="voiceLoading"
                  >Loading voices…</span
                >
                <i class="ri-arrow-down-s-line"></i>
              </div>
              <div class="select-options" id="voiceOptions"></div>
            </div>
            <button
              id="btnPreviewVoice"
              class="voice-preview-btn"
              data-i18n-title="voicePreviewTitle"
              title="Preview Voice"
            >
              <i class="ri-volume-up-line"></i>
            </button>
          </div>
        </div>
      </aside>

      <!-- Stats Modal -->
      <div class="modal-overlay" id="statsModal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 data-i18n="statsTitle">Learning Stats</h2>
            <button class="popup-close" id="closeStats">
              <i class="ri-close-line"></i>
            </button>
          </div>
          <div class="stats-grid" id="statsGrid"></div>
        </div>
      </div>

      <!-- Wordbook Modal -->
      <div class="modal-overlay" id="wordbookModal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 data-i18n="wordbookTitle">Word Book</h2>
            <button class="popup-close" id="closeWordbook">
              <i class="ri-close-line"></i>
            </button>
          </div>
          <ul class="wordbook-list" id="wordbookList"></ul>
        </div>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth-guard.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("./sw.js")
            .then((reg) => {
              console.log("SW registered!", reg);
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: "SKIP_WAITING" });
              }
              reg.addEventListener("updatefound", () => {
                const newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    newWorker.postMessage({ type: "SKIP_WAITING" });
                  }
                });
              });
            })
            .catch((err) => console.log("SW registration failed", err));
        });
      }
    </script>
  </body>
</html>
